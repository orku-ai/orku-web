<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E9DFCB">
  <title>orku</title>
  <link rel="icon" href="orku-mark.svg" type="image/svg+xml">
  <style>
    :root { --sand: #E9DFCB; }
    html, body { margin: 0; height: 100%; background: var(--sand); }
    main {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { margin: 0; width: 100%; max-width: 260px; line-height: 0; }
    h1 img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <h1><img src="orku-logo.svg" alt="orku" width="260" height="103"></h1>
  </main>
</body>
</html>
