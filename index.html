<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E9DFCB">
  <title>orku</title>
  <link rel="icon" href="orku-mark.svg" type="image/svg+xml">
  <style>
    :root { --sand: #E9DFCB; }
    html, body { margin: 0; height: 100%; background: var(--sand); }
    body { touch-action: none; }
    main {
      position: relative;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { margin: 0; width: 100%; max-width: 180px; line-height: 0; }
    h1 svg { display: block; width: 100%; height: auto; aspect-ratio: 814 / 324; }

    /* Soft amber light that follows the pointer */
    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      background: radial-gradient(circle 420px at var(--x, 50%) var(--y, 50%),
                  rgba(246, 176, 79, 0.16), rgba(246, 176, 79, 0) 70%);
    }
    .glow.on { opacity: 1; }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <h1>
      <!-- Same artwork as orku-logo.svg, inlined so the wedge can turn. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 6 814 324" role="img" aria-label="orku" width="180" height="72">
        <defs>
          <clipPath id="orku-k-clip"><rect x="428" y="100" width="200" height="200"/></clipPath>
        </defs>
        <!-- o: disc with two-tone wedge -->
        <circle id="disc" cx="107" cy="200" r="107" fill="#18191A"/>
        <g id="wedge">
          <path d="M107 200 L107 114 A86 86 0 0 1 193 200 Z" fill="#F6B04F"/>
          <path d="M107 200 L107 154 A46 46 0 0 1 153 200 Z" fill="#D63F1C"/>
        </g>
        <!-- r -->
        <rect x="244" y="100" width="46" height="200" fill="#18191A"/>
        <path d="M284 150 C296 115 319 97 346 97 L354 97 L354 140 L346 140 C319 140 296 155 290 185 Z" fill="#18191A"/>
        <!-- k -->
        <rect x="382" y="36" width="46" height="264" fill="#18191A"/>
        <g clip-path="url(#orku-k-clip)" stroke="#18191A" stroke-linecap="butt">
          <line x1="405" y1="246" x2="562" y2="47" stroke-width="50"/>
          <line x1="462" y1="174" x2="544" y2="330" stroke-width="48"/>
        </g>
        <!-- u -->
        <path d="M582 100 L628 100 L628 205 C628 240 642 258 668 258 C688 258 702 248 708 232 L708 280 C694 296 678 302 662 302 C612 302 582 272 582 215 Z" fill="#18191A"/>
        <rect x="708" y="100" width="46" height="200" fill="#18191A"/>
      </svg>
    </h1>
  </main>
  <script>
    // The wedge in the "o" turns to point at the pointer; a soft glow follows it.
    // At rest the wedge points up-right (-45deg), so rotation = pointer angle + 45.
    (() => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const wedge = document.getElementById('wedge');
      const disc = document.getElementById('disc');
      const glow = document.querySelector('.glow');
      let target = 0, current = 0, frame = 0, restTimer = 0;

      const tick = () => {
        const diff = (((target - current) % 360) + 540) % 360 - 180; // shortest way round
        current += Math.abs(diff) < 0.05 ? diff : diff * 0.12;
        wedge.setAttribute('transform', `rotate(${current.toFixed(2)} 107 200)`);
        frame = Math.abs(diff) < 0.05 ? 0 : requestAnimationFrame(tick);
      };
      const animate = () => { if (!frame) frame = requestAnimationFrame(tick); };

      const follow = (e) => {
        const r = disc.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        target = Math.atan2(dy, dx) * 180 / Math.PI + 45;
        glow.style.setProperty('--x', e.clientX + 'px');
        glow.style.setProperty('--y', e.clientY + 'px');
        glow.classList.add('on');
        clearTimeout(restTimer);
        animate();
      };
      const rest = () => { target = 0; glow.classList.remove('on'); animate(); };

      addEventListener('pointermove', follow);
      addEventListener('pointerdown', follow);
      addEventListener('pointerup', (e) => {
        if (e.pointerType !== 'mouse') restTimer = setTimeout(rest, 1200);
      });
      addEventListener('pointercancel', rest);
      document.documentElement.addEventListener('mouseleave', rest);
      addEventListener('blur', rest);
    })();
  </script>
</body>
</html>
